version: '3.8'
services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: quickbite
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata_reviews:/var/lib/postgresql/data

  zookeeper:
    image: wurstmeister/zookeeper:3.4.6
    ports:
      - '2181:2181'

  kafka:
    image: wurstmeister/kafka:2.12-2.2.1
    ports:
      - '9092:9092'
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_HOST_NAME: localhost
      KAFKA_CREATE_TOPICS: 'review-created:1:1'
    depends_on:
      - zookeeper

  reviews-service:
    build: .
    ports:
      - '8085:8085'
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/quickbite
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWK_SET_URI: ''
    depends_on:
      - postgres
      - kafka

volumes:
  pgdata_reviews:

